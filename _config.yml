# Configuración de la web de Iván Z (GitHub Pages + Jekyll)
title: Iván Z
description: Herramientas de ciberseguridad hechas para usarse. Descarga ZGuard y ZIntercept, y lee apuntes técnicos.
url: https://ivanzv-z.github.io
baseurl: ""
lang: es

# Cuenta de GitHub y descargas de la app protagonista.
# "latest/download/<archivo>" siempre baja la última versión publicada en Releases,
# así que al publicar una versión nueva NO hace falta tocar la web
# (basta con subir los archivos con estos mismos nombres).
github: https://github.com/ivanzv-z
zintercept_repo: https://github.com/ivanzv-z/zintercept
zintercept_win: https://github.com/ivanzv-z/zintercept/releases/latest/download/ZIntercept-Setup-x64.exe
zintercept_deb: https://github.com/ivanzv-z/zintercept/releases/latest/download/zintercept-amd64.deb
zintercept_win_size: 106 MB
zintercept_deb_size: 121 MB
sugerencias: https://github.com/ivanzv-z/zintercept/issues/new?template=sugerencia.yml
seguridad: https://github.com/ivanzv-z/zintercept/security/advisories/new

# ZGuard (monitor de red y cortafuegos para Windows). Mismo sistema: Releases > latest.
zguard_repo: https://github.com/ivanzv-z/zguard
zguard_win: https://github.com/ivanzv-z/zguard/releases/latest/download/ZGuard-Setup-x64.exe
zguard_win_size: 101 MB

# Cada apunte queda en /apuntes/nombre-del-archivo/
permalink: /apuntes/:title/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
highlighter: rouge

# Meses en español para las fechas
meses: [enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre]

# .well-known/security.txt (Jekyll ignora por defecto las carpetas con punto)
include:
  - .well-known

exclude:
  - README.md
  - .gitignore
